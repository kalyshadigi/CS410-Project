
name: CI
 
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:  
  group: ci-${{ github.ref }}  
  cancel-in-progress: true
 
jobs:
  tests:
      name: Build and run tests
      runs-on: ubuntu-latest
 
      steps:
      - name: Check out code
        uses: actions/checkout@v4
 
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
 
      - name: Build test executables
        run: cmake --build build --parallel --target all_tests  
 
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --timeout 60 --output-junit test-results.xml  
 
      - name: Upload test results  
        if: always()  
        uses: actions/upload-artifact@v4  
        with:  
          name: test-results  
          path: build/test-results.xml  

  build-app:
      name: Build full program
      runs-on: ubuntu-latest
      steps:
      - name: Check out code
        uses: actions/checkout@v4
 
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
 
      - name: Build app  
        run: cmake --build build --parallel --target app  